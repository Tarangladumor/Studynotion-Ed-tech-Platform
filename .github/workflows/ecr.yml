
name: Build and push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 4: Build and push server image
      - name: Build and push server image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/studynotion-server:${{ github.sha }} \
            -t $REGISTRY/studynotion-server:latest \
            ./SERVER

          docker push --all-tags $REGISTRY/studynotion-server

      # Step 5: Build and push client image
      - name: Build and push client image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg REACT_APP_BASE_URL=/api/v1 \
            -t $REGISTRY/studynotion-client:${{ github.sha }} \
            -t $REGISTRY/studynotion-client:latest \
            .

          docker push --all-tags $REGISTRY/studynotion-client
